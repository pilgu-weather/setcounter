services:
  - type: web
    name: set-counter
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: SETCOUNTER_SESSION_COOKIE_SECURE
        value: "1"
      - key: SETCOUNTER_TRUST_PROXY
        value: "1"
      - key: REMINDER_CRON_TOKEN
        sync: false
      - key: DISCORD_COMPLAINT_WEBHOOK_URL
        sync: false
      - key: ANDROID_SHA256_CERT_FINGERPRINT
        sync: false
      - key: PUBLIC_SUPPORT_EMAIL
        value: northstarlabshelp@gmail.com
